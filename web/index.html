</head>
<body>
  <script>
    window.playSparkTone = function(frequency, duration) {
      try {
        if (!window.audioCtx) {
          window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (window.audioCtx.state === 'suspended') {
          window.audioCtx.resume();
        }
        
        const osc = window.audioCtx.createOscillator();
        const gainNode = window.audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(window.audioCtx.destination);
        
        osc.type = 'triangle'; // Warm, therapeutic chime waveform
        osc.frequency.setValueAtTime(frequency, window.audioCtx.currentTime);
        
        // Attack-Decay envelope
        gainNode.gain.setValueAtTime(0, window.audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.25, window.audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, window.audioCtx.currentTime + duration);
        
        osc.start(window.audioCtx.currentTime);
        osc.stop(window.audioCtx.currentTime + duration);
      } catch (e) {
        console.error("Web Audio API error: ", e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
